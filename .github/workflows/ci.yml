name: Release checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Set up the requested Python and development tools
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          uv python install "$PYTHON_VERSION"
          uv venv --managed-python --python "$PYTHON_VERSION" "$RUNNER_TEMP/which-session-venv"
          uv pip install --python "$RUNNER_TEMP/which-session-venv/bin/python" pytest ruff
          echo "$RUNNER_TEMP/which-session-venv/bin" >> "$GITHUB_PATH"
      - name: Validate the checkout
        run: |
          python --version
          ruff check . which-session
          python -m pytest -q
      - name: Check the files distributed in the source archive
        shell: bash
        run: |
          candidate="$RUNNER_TEMP/which-session-source"
          mkdir -p "$candidate"
          git archive HEAD | tar -xf - -C "$candidate"
          cd "$candidate"
          python examples/demo.py
          python -m pytest -q tests/test_release_smoke.py
